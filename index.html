<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>승찬이 첫돌 초대장</title>

<meta name="description" content="승찬이의 첫돌에 초대합니다.">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="승찬이 첫돌 초대장">
<meta property="og:description" content="2026년 8월 8일 오전 11시 30분">
<meta property="og:image" content="thumbnail.jpg">
<meta property="og:url" content="https://seungchan-first-birthday.kimyusin-clone.workers.dev/">

<meta name="theme-color" content="#ffffff">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    background:#ffffff;
    font-family:sans-serif;

    display:flex;
    justify-content:center;
}

.container{

    width:100%;
    max-width:720px;

}

.page{

    position:relative;
    width:100%;

}

.page img{

    display:block;
    width:100%;
    height:auto;

}

/* 링크 */

.map{

    position:absolute;

    top:7.3%;
    left:10.5%;

    width:29%;
    height:13%;

}

.waze{

    position:absolute;

    top:7.3%;
    left:60.5%;

    width:29%;
    height:13%;

}

a{

    -webkit-tap-highlight-color:transparent;

}

.fade{

    animation:fade .5s ease;

}

@keyframes fade{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }

}

</style>

</head>

<body>

<div class="container fade">

    <div class="page">

        <img src="b1.png" alt="승찬이 돌잔치 초대장">

    </div>

    <div class="page">

        <img src="b2.png" alt="오시는 길">

        <!-- Google Maps -->
        <a
        class="map"
        href="https://maps.app.goo.gl/fu6o8DoBR2a4A7WL8"
        target="_blank"
        aria-label="Google Maps">
        </a>

        <!-- Waze -->
        <a
        class="waze"
        href="https://waze.com/ul/hwdw4f0ct6"
        target="_blank"
        aria-label="Waze">
        </a>

    </div>

</div>

</body>

</html>
